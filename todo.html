<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Todo - RoadMap</title>
  <link rel="stylesheet" href="css/todo.css">
</head>
<body>

  <!-- ==========================================
      Navigation Bar
      ========================================== -->
  <nav class="navbar">
    <div class="navbar-brand">
      <div class="icon">R</div>
      <span>RoadMap</span>
    </div>
    <ul class="navbar-nav">
      <li><a href="index.html">Roadmap</a></li>
      <li><a href="todo.html" class="active">Todo List</a></li>
    </ul>
  </nav>

  <!-- ==========================================
      Todo Page Content
      ========================================== -->
  <main class="container todo-container">

    <!-- Header -->
    <div class="page-header">
      <h1>Daily Todo</h1>
      <p>Track your daily tasks. Each day has its own independent list.</p>
    </div>

    <!-- Calendar Section -->
    <section class="calendar-section">
      <div class="calendar-header">
        <h2 class="calendar-title" id="calendar-title">—</h2>
        <div class="calendar-nav">
          <button id="prev-month-btn" class="cal-nav-btn" title="Previous month">◀</button>
          <button id="today-btn" class="cal-today-btn">Today</button>
          <button id="next-month-btn" class="cal-nav-btn" title="Next month">▶</button>
        </div>
      </div>
      <div class="calendar-weekdays">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div id="calendar-days" class="calendar-days">
        <!-- Rendered by JavaScript -->
      </div>
    </section>

    <!-- Selected Date Display -->
    <div class="date-display-section">
      <div class="date-display" id="date-display">
        <!-- Rendered by JavaScript -->
      </div>
    </div>

    <!-- Add Task Form -->
    <form id="add-task-form" class="add-task-form" autocomplete="off">
      <div class="form-row">
        <input
          type="text"
          id="task-input"
          class="task-input"
          placeholder="What do you want to accomplish today?"
          aria-label="New task"
        />
        <button type="button" id="add-btn" class="add-btn">Add Task</button>
      </div>
    </form>

    <!-- Daily Stats -->
    <div id="daily-stats" class="daily-stats">
      <!-- Rendered by JavaScript -->
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs" id="filter-tabs" role="tablist" aria-label="Filter tasks">
      <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="filter-tab" data-filter="active" role="tab" aria-selected="false">Active</button>
      <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false">Completed</button>
    </div>

    <!-- Task List -->
    <div id="task-list" class="task-list" role="list">
      <!-- Tasks are rendered by JavaScript -->
    </div>

    <!-- Task Count -->
    <div id="task-count" class="task-count" aria-live="polite">No tasks</div>

    <!-- Clear Completed -->
    <div class="clear-section">
      <button id="clear-completed-btn" class="clear-completed">Clear completed tasks</button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>RoadMap &copy; 2026 &mdash; Your daily tasks are stored locally in your browser</p>
  </footer>

  <!-- JavaScript -->
  <script src="js/todo.js"></script>
</body>
</html>
